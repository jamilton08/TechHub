<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room 333: Survive the week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --card:#FFFFFF; --ink:#16213A; --muted:#586277; --line:#CFD6E0;
  --blue:#2451CC; --blue-soft:#E3E9FA;
  --green:#1F7A52; --green-soft:#DDF2E6;
  --red:#C9392A; --red-soft:#FAE3DF;
  --amber:#9A6A0A; --amber-soft:#FBEFD0;
  --stamp:#B3261E;
  --hsct-color:#2451CC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
.app{max-width:760px;margin:0 auto;padding:0 20px 80px}
.hud{position:sticky;top:0;background:var(--bg);padding:16px 0 12px;z-index:5;border-bottom:1px solid var(--line)}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:-0.01em}
.days{display:flex;gap:4px}
.day{padding:4px 10px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid transparent}
.day.on{background:var(--ink);color:#fff}
.day.done{color:var(--ink);border-color:var(--line)}
.meters{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;margin-top:12px;align-items:center}
.meter label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter label b{font-weight:500;color:var(--ink)}
.bar{height:8px;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.bar i.warn{background:var(--amber)}
.bar i.bad{background:var(--red)}
.record{display:flex;gap:6px;flex-wrap:wrap;min-height:28px;align-items:center}
.stamp{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:2px 7px;transform:rotate(-4deg)}
.stamp.new{animation:slam .4s cubic-bezier(.2,1.4,.5,1) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;margin-top:24px}
.when{font-size:14px;color:var(--muted);margin:0 0 6px}
h1{font-size:34px;line-height:1.1;margin:0 0 16px;font-weight:700;letter-spacing:-0.02em}
h2{font-size:26px;line-height:1.15;margin:0 0 12px;font-weight:700;letter-spacing:-0.015em}
p{margin:0 0 14px}
.choices{display:grid;gap:10px;margin-top:20px}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover:not([disabled]),.choice:focus-visible{border-color:var(--ink);outline:none}
.choice:focus-visible{box-shadow:0 0 0 3px var(--blue-soft)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--muted)}
.choice.dim{opacity:.45;cursor:default}
.choice.picked{cursor:default}
.choice.picked.best{border-color:var(--green);background:var(--green-soft)}
.choice.picked.ok{border-color:var(--amber);background:var(--amber-soft)}
.choice.picked.bad{border-color:var(--red);background:var(--red-soft)}
.verdict{display:inline-flex;align-items:center;gap:12px;font-weight:500;font-size:14px;padding:5px 12px;border-radius:999px;margin:22px 0 10px}
.verdict.best{background:var(--green-soft);color:var(--green)}
.verdict.ok{background:var(--amber-soft);color:var(--amber)}
.verdict.bad{background:var(--red-soft);color:var(--red)}
.delta{font-size:13px;color:var(--muted);font-weight:400}
.rule{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 16px;margin:16px 0;border-radius:0 8px 8px 0}
.rule small{display:block;font-size:13px;color:var(--blue);font-weight:500;margin-bottom:4px}
.discuss{border:1.5px dashed var(--line);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:15px}
.discuss small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.btn{font:inherit;font-weight:500;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;font-size:16px}
.btn:hover{background:#0E1730}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.name-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.name-row input{flex:1;min-width:220px;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px}
.name-row input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.name-row .err{display:none;color:var(--red);font-size:15px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap}
.toggle{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);cursor:pointer;margin:8px 0 4px}
.toggle input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.metric{background:var(--bg);border-radius:10px;padding:14px 16px}
.metric small{display:block;font-size:13px;color:var(--muted)}
.metric b{font-size:28px;font-weight:700;letter-spacing:-0.02em}
.secs{display:grid;gap:8px;margin:8px 0 20px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.tag{font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.best{background:var(--green-soft);color:var(--green)}
.tag.ok{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.sign{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:560px){
  .card{padding:20px 18px} h1{font-size:28px} h2{font-size:22px}
  .grid{grid-template-columns:1fr 1fr} .meters{grid-template-columns:1fr 1fr} .record{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.stamp.new{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<!-- HSCT KIT START — do not edit; copy the whole block from lesson-template/hsct-lesson.js -->
<script>
/* ============================================================================
   HSCT LESSON KIT  v1.0
   Every lesson on HSCT TechHub inlines this block unchanged (between the
   <!-- HSCT KIT START --> and <!-- HSCT KIT END --> markers). It gives a
   lesson three things:

     1. A clock.   HSCT.start(name) when the student begins. The kit records
                   wall-clock time and "active" time (tab visible).
     2. A log.     HSCT.log(type, data) for anything worth remembering —
                   answers, hints, retries. Ends up inside the result file.
     3. A result.  HSCT.endScreen(el, {...scores}) renders the standard result
                   card: name, score, time taken, badge code, and a button
                   that downloads the encrypted result file the student
                   submits in Google Classroom.

   The file is encrypted with the teacher's PUBLIC key below (RSA-OAEP wrapping
   an AES-256-GCM key). It can only be opened with the matching private key,
   on the site's /lessons/verify page. Students can't read or edit it.

   API (all on window.HSCT):
     HSCT.lesson({ id, title, version, course, possible })   once, at load
     HSCT.start(name)                                        when work begins
     HSCT.log(type, data)                                    any time
     HSCT.elapsed()   -> { seconds, activeSeconds }
     HSCT.finish({ earned, possible, sections, tier, extra }) -> Promise<result>
     HSCT.endScreen(el, { earned, possible, sections, tier, extra, note })
                      -> Promise<result>   (calls finish, renders the card)
     HSCT.download()  / HSCT.copyCode()                      after finish
   ========================================================================== */
(function () {
  'use strict';
  var KIT = '1.0';

  /* Mr. Cruz's public key. Replace the whole object if the key pair is ever
     regenerated on /lessons/verify — and keep the private key out of git. */
  var PUBLIC_KEY = {"kty":"RSA","n":"rZUBRxn7dUikufJq7z2XVn-on4Of0IyQr_YaPSTgIUaGsYKcrZ4FNROL4A_ZM5JShLf6OVp2ZeAI7XN_7iX0tvd79RqAWRM9an6rx-s6bMYSW1wmtRxZyL-BX56vTtikVRLNO7uyzCb8kevJE71Fi6nlPhdXa-iS4vtIEm2Wjh4cLPinAKhMnkO3BpGHUhtFw7Hyus1w04EdLxowk4UcN7d0w4MQRnBV8ehXQVoLVQ0_QtfrtPTQOpScHuwyaw9nwnTA7h7BEOv1ZkbEyq2N4TFixSSCsneUsc3PlbZOndDzMGMmdMr00ulntRZBfyioFzRcsRUGGwAqpB9SuH7XGQ","e":"AQAB","alg":"RSA-OAEP-256","ext":true};

  var VERIFY_URL = 'hsct.tech/lessons/verify';

  var cfg = null;      // lesson config
  var ses = null;      // current session
  var ticker = null;   // active-time interval
  var result = null;   // { badge, filename, text, envelope, payload }

  /* ---------- small helpers ---------- */
  var enc = new TextEncoder();
  function b64(buf) {
    var bytes = new Uint8Array(buf), s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDuration(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + ' h ' + pad(m) + ' min';
    if (m) return m + ' min ' + pad(s) + ' s';
    return s + ' s';
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return iso; }
  }
  function slug(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'student'; }
  function stamp(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()); }

  /* Badge code: 8 characters from a SHA-256 of the result, shown on screen
     so a screenshot can be matched to its file. */
  var ALPHABET = 'ABCDEFGHJKMNPQRSTVWXYZ23456789';
  function badgeFrom(hashBuf) {
    var bytes = new Uint8Array(hashBuf), out = '';
    for (var i = 0; i < 8; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out.slice(0, 4) + '-' + out.slice(4);
  }

  function needSubtle() {
    if (!(window.crypto && crypto.subtle)) {
      throw new Error('Result files need a secure page (https). Open this lesson from the TechHub site and finish again.');
    }
  }

  /* ---------- public API ---------- */
  function lesson(c) {
    if (!c || !c.id || !c.title) throw new Error('HSCT.lesson needs { id, title }');
    cfg = { version: '1.0', course: '', possible: 100 };
    for (var k in c) cfg[k] = c[k];
    return HSCT;
  }

  function start(name) {
    if (!cfg) throw new Error('Call HSCT.lesson({...}) before HSCT.start(name)');
    name = String(name || '').trim().replace(/\s+/g, ' ');
    if (name.length < 2) throw new Error('HSCT.start needs the student\'s name');
    ses = { name: name, started: new Date().toISOString(), t0: Date.now(), active: 0, events: [] };
    result = null;
    clearInterval(ticker);
    ticker = setInterval(function () { if (document.visibilityState === 'visible') ses.active += 1; }, 1000);
    log('start');
    return HSCT;
  }

  function log(type, data) {
    if (!ses) return HSCT;
    var e = { t: Math.round((Date.now() - ses.t0) / 100) / 10, type: String(type) };
    if (data && typeof data === 'object') for (var k in data) if (k !== 't' && k !== 'type') e[k] = data[k];
    if (ses.events.length < 800) ses.events.push(e);
    return HSCT;
  }

  function elapsed() {
    if (!ses) return { seconds: 0, activeSeconds: 0 };
    return { seconds: Math.round((Date.now() - ses.t0) / 1000), activeSeconds: ses.active };
  }

  /* Build, seal, and keep the result. Resolves to { badge, filename, text, payload }. */
  async function finish(opts) {
    if (!cfg || !ses) throw new Error('HSCT.start(name) was never called');
    needSubtle();
    opts = opts || {};
    clearInterval(ticker);
    var finished = new Date();
    var el = elapsed();
    var earned = Number(opts.earned || 0), possible = Number(opts.possible || cfg.possible || 0);
    var payload = {
      kit: KIT,
      lesson: { id: cfg.id, title: cfg.title, version: cfg.version, course: cfg.course },
      student: { name: ses.name },
      started: ses.started,
      finished: finished.toISOString(),
      seconds: el.seconds,
      activeSeconds: el.activeSeconds,
      score: { earned: earned, possible: possible, percent: possible ? Math.round(1000 * earned / possible) / 10 : null },
      tier: opts.tier || null,
      sections: (opts.sections || []).map(function (s) { return { id: s.id, title: s.title, earned: s.earned, possible: s.possible, status: s.status }; }),
      extra: opts.extra || null,
      events: ses.events,
      env: { tz: Intl.DateTimeFormat().resolvedOptions().timeZone, ua: navigator.userAgent, url: location.href.split('?')[0] },
    };
    var hash = await crypto.subtle.digest('SHA-256', enc.encode(JSON.stringify(payload)));
    var badge = badgeFrom(hash);
    payload.badge = badge;

    /* header travels in the clear but is authenticated (AES-GCM additional data) */
    var header = { hsct: 1, kit: KIT, lesson: cfg.id, title: cfg.title, student: ses.name, finished: payload.finished, badge: badge };
    var pub = await crypto.subtle.importKey('jwk', PUBLIC_KEY, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['wrapKey']);
    var aes = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(JSON.stringify(header)) }, aes, enc.encode(JSON.stringify(payload)));
    var wrapped = await crypto.subtle.wrapKey('raw', aes, pub, { name: 'RSA-OAEP' });
    var envelope = {};
    for (var k in header) envelope[k] = header[k];
    envelope.key = b64(wrapped); envelope.iv = b64(iv); envelope.data = b64(data);

    result = {
      badge: badge,
      filename: 'HSCT_' + cfg.id + '_' + slug(ses.name) + '_' + stamp(finished) + '.hsct',
      text: JSON.stringify(envelope),
      payload: payload,
    };
    return result;
  }

  function download() {
    if (!result) throw new Error('Nothing to download yet — call HSCT.finish first');
    var blob = new Blob([result.text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = result.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    return result.filename;
  }

  async function copyCode() {
    if (!result) throw new Error('Nothing to copy yet — call HSCT.finish first');
    try { await navigator.clipboard.writeText(result.text); return true; }
    catch (e) {
      var ta = document.createElement('textarea'); ta.value = result.text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove(); return ok;
    }
  }

  /* ---------- the standard end screen ---------- */
  var CSS = '.hsct-card{--hsct-ink:#101a3f;--hsct-mute:#5b6485;--hsct-line:#d3d9ee;--hsct-accent:var(--hsct-color,#1f3fae);--hsct-ok:#1f7a3d;--hsct-bad:#b3261e;'
    + 'font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--hsct-ink);background:#fff;border:1px solid var(--hsct-line);border-left:6px solid var(--hsct-accent);border-radius:12px;padding:20px 22px;margin:20px 0;line-height:1.45}'
    + '.hsct-card *{box-sizing:border-box}.hsct-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--hsct-mute)}.hsct-head b{color:var(--hsct-accent)}'
    + '.hsct-name{font-size:22px;font-weight:700;margin:6px 0 2px}.hsct-score{font-size:15px;margin:0 0 12px}.hsct-score b{font-size:28px;font-weight:700}.hsct-score .hsct-tier{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:var(--hsct-accent);color:#fff;font-size:13px;font-weight:600;vertical-align:middle}'
    + '.hsct-facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px;font-size:14px}.hsct-facts dt{color:var(--hsct-mute)}.hsct-facts dd{margin:0}.hsct-facts code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.08em;font-weight:600}'
    + '.hsct-secs{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px}.hsct-secs td{padding:5px 0;border-top:1px solid var(--hsct-line)}.hsct-secs td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}'
    + '.hsct-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hsct-btn{font:600 15px "IBM Plex Sans","Segoe UI",system-ui,sans-serif;padding:11px 18px;border-radius:8px;border:2px solid var(--hsct-accent);background:var(--hsct-accent);color:#fff;cursor:pointer}.hsct-btn:hover{filter:brightness(.92)}.hsct-btn.hsct-alt{background:transparent;color:var(--hsct-accent)}.hsct-btn:focus-visible{outline:3px solid #a9b7ea;outline-offset:2px}.hsct-btn:disabled{opacity:.55;cursor:wait}'
    + '.hsct-note{margin:12px 0 0;font-size:13.5px;color:var(--hsct-mute)}.hsct-status{margin:8px 0 0;font-size:14px;min-height:1.4em}.hsct-status.ok{color:var(--hsct-ok)}.hsct-status.bad{color:var(--hsct-bad)}'
    + '@media print{.hsct-actions,.hsct-note,.hsct-status{display:none}}';

  function injectCss() {
    if (document.getElementById('hsct-kit-css')) return;
    var s = document.createElement('style'); s.id = 'hsct-kit-css'; s.textContent = CSS; document.head.appendChild(s);
  }

  /* Renders the card into `el` and seals the result. Resolves with the result. */
  async function endScreen(el, opts) {
    if (typeof el === 'string') el = document.querySelector(el);
    if (!el) throw new Error('HSCT.endScreen needs an element');
    injectCss();
    opts = opts || {};
    var elp = elapsed();
    var possible = Number(opts.possible || cfg.possible || 0), earned = Number(opts.earned || 0);
    var pct = possible ? Math.round(100 * earned / possible) : null;
    var secs = (opts.sections || []).map(function (s) {
      var right = s.status != null ? esc(s.status) : (s.possible != null ? esc(s.earned) + ' / ' + esc(s.possible) : esc(s.earned));
      return '<tr><td>' + esc(s.title) + '</td><td>' + right + '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="hsct-card">'
      + '<div class="hsct-head"><span><b>HSCT TechHub</b> result</span><span>' + esc(cfg.title) + '</span></div>'
      + '<div class="hsct-name">' + esc(ses ? ses.name : '') + '</div>'
      + '<div class="hsct-score"><b>' + esc(earned) + '</b> / ' + esc(possible) + (pct != null ? ' <span>(' + pct + '%)</span>' : '') + (opts.tier ? '<span class="hsct-tier">' + esc(opts.tier) + '</span>' : '') + '</div>'
      + '<dl class="hsct-facts"><dt>Finished</dt><dd>' + esc(fmtDate(new Date().toISOString())) + '</dd>'
      + '<dt>Time taken</dt><dd>' + esc(fmtDuration(elp.seconds)) + (elp.activeSeconds < elp.seconds - 60 ? ' <span style="color:var(--hsct-mute)">(' + esc(fmtDuration(elp.activeSeconds)) + ' with the tab open)</span>' : '') + '</dd>'
      + '<dt>Code</dt><dd><code class="hsct-badge">........</code></dd></dl>'
      + (secs ? '<table class="hsct-secs"><tbody>' + secs + '</tbody></table>' : '')
      + '<div class="hsct-actions"><button type="button" class="hsct-btn hsct-dl" disabled>Download your result file</button><button type="button" class="hsct-btn hsct-alt hsct-copy" disabled>Copy result code</button></div>'
      + '<p class="hsct-note">' + esc(opts.note || 'Submit the file in Google Classroom. If downloads are blocked, copy the code and paste it instead. The file is encrypted: only your teacher can open it.') + '</p>'
      + '<p class="hsct-status" aria-live="polite">Preparing your result file…</p>'
      + '</div>';
    var status = el.querySelector('.hsct-status'), dl = el.querySelector('.hsct-dl'), cp = el.querySelector('.hsct-copy');
    try {
      var r = await finish(opts);
      el.querySelector('.hsct-badge').textContent = r.badge;
      status.textContent = 'Ready: ' + r.filename;
      dl.disabled = false; cp.disabled = false;
      dl.onclick = function () { try { download(); status.className = 'hsct-status ok'; status.textContent = 'Downloaded ' + r.filename + ' — now submit it.'; } catch (e) { status.className = 'hsct-status bad'; status.textContent = e.message; } };
      cp.onclick = async function () { var ok = await copyCode(); status.className = 'hsct-status ' + (ok ? 'ok' : 'bad'); status.textContent = ok ? 'Code copied — paste it into your submission.' : 'Copy failed. Use the download instead.'; };
      return r;
    } catch (e) {

    }
  }

  var HSCT = {
    kit: KIT, verifyUrl: VERIFY_URL,
    lesson: lesson, start: start, log: log, elapsed: elapsed,
    finish: finish, download: download, copyCode: copyCode, endScreen: endScreen,

    get session() { return ses ? { name: ses.name, started: ses.started } : null; },
    fmtDuration: fmtDuration,
  };
  window.HSCT = HSCT;
})();
</script>

const app = document.getElementById("app");
let S, teacher = false, lastName = "";

function reset(){ S = { rep:30, grade:90, flags:new Set(), i:0, secs:{}, picked:null, stampNew:null, extra:"" }; }
function clamp(n){ return Math.max(0, Math.min(100, Math.round(n))); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function resolve(sc){
  if (sc.alts) for (const a of sc.alts) if (S.flags.has(a.when)) return Object.assign({}, sc, a);
  return sc;
}

function hud(){
  const done = S.i >= SCENES.length;
  const curDay = done ? 5 : SCENES[S.i].day;
  const days = DAYS.map((d,k) => `<span class="day ${k===curDay?"on":k<curDay?"done":""}">${d.slice(0,3)}</span>`).join("");
  const repC = S.rep < 35 ? "bad" : S.rep < 70 ? "warn" : "";
  const grC  = S.grade < 65 ? "bad" : S.grade < 80 ? "warn" : "";
  const stamps = [...S.flags].filter(f => FLAGS[f]).map(f => `<span class="stamp ${f===S.stampNew?"new":""}">${FLAGS[f]}</span>`).join("");
  return `<header class="hud">
    <div class="hud-row"><span class="brand">Room 333: survive the week</span><nav class="days" aria-label="Days">${days}</nav></div>
    <div class="meters">
      <div class="meter"><label>Reputation with Mr. Cruz <b>${S.rep}</b></label><div class="bar"><i class="${repC}" style="width:${S.rep}%"></i></div></div>
      <div class="meter"><label>Projected grade <b>${S.grade}</b></label><div class="bar"><i class="${grC}" style="width:${S.grade}%"></i></div></div>
      <div class="record" aria-label="Your record">${stamps || '<span class="hint">Clean record</span>'}</div>
    </div></header>`;
}

    <p class="when">Web / Game Design and IT, Room 333</p>
    <h1>Survive the week in Room 333</h1>
    <p>Five days. Eighteen decisions. Every one of them is covered in the class rules you're about to sign. Your reputation with Mr. Cruz starts at 30 and your grade starts at 90. Reputation is built slowly and lost fast. Keep both up.</p>
    <p>Consequences carry forward. Show up late Monday and you'll feel it later that period. Skip a citation Tuesday and it comes back around.</p>
    <label class="toggle"><input type="checkbox" id="tm" ${teacher?"checked":""}> Teacher mode: show a discussion prompt after each scene</label>
    <div class="name-row"><input id="name" type="text" placeholder="Your full name (goes on your result)" autocomplete="off" maxlength="60" value="${esc(lastName)}"><span class="err" id="name-err">Enter your name first.</span></div>
    <div class="actions"><span class="hint">Keys 1 to 3 pick an answer. Enter moves on.</span><button class="btn" id="start">Start Monday</button></div>
  </main>`;
  document.getElementById("name").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("start").click(); });
}

  }
  app.innerHTML = hud() + `<main class="card">
    <p class="when">${DAYS[sc.day]}, ${sc.time}</p>
    <h2>${esc(sc.title)}</h2>
    <p>${esc(sc.text)}</p>
    <div class="choices">${choices}</div>${fb}</main>`;
  if (p != null) document.getElementById("next").focus({ preventScroll:true });
}

function renderEnd(){
  const r = S.rep;
  const tier = r >= 90 ? ["Model coworker", "Mr. Cruz would put you on any team in this room. Sign the acknowledgment and mean it."]
    : r >= 70 ? ["Solid week", "You know most of the rules cold. Reread the flagged sections and you're there."]
    : r >= 45 ? ["Rough week", "Nothing unrecoverable, but the rules aren't landing yet. Read the flagged sections before you sign anything."]
    : ["Meeting with Mr. Cruz", "There's a parent call in your future. Go back to the rules, all eight sections, before Monday."];
  const secs = Object.keys(SECTIONS).map(n => {
    const v = S.secs[n] || "best";
    const t = { best:"Solid", ok:"Close", bad:`Reread section ${n}` }[v];
    return `<div class="sec"><span>${n}. ${SECTIONS[n]}</span><span class="tag ${v}">${t}</span></div>`;
  }).join("");
  const stamps = [...S.flags].filter(f => FLAGS[f]).map(f => `<span class="stamp">${FLAGS[f]}</span>`).join("") || '<span class="hint">Clean</span>';
  app.innerHTML = hud() + `<main class="card">
    <p class="when">Friday, 9:05 AM</p>
    <h1>${tier[0]}</h1>
    <p>${tier[1]}</p>
    <div class="grid">
      <div class="metric"><small>Reputation</small><b>${S.rep}</b></div>
      <div class="metric"><small>Projected grade</small><b>${S.grade}</b></div>
      <div class="metric"><small>Record</small><div class="record" style="margin-top:6px">${stamps}</div></div>
    </div>
    <h2 style="font-size:20px">Section by section</h2>
    <div class="secs">${secs}</div>
    <div class="sign">Acknowledgment: "I have read and understand Mr. Cruz's class rules and expectations for the 2026–2027 school year." If you signed that today, would you mean it?</div>
    <div id="hsct-result"></div>
    <div class="actions"><button class="btn ghost" id="again">Play again</button></div>
  </main>`;
  /* Seal the result file and render the standard card. Score = reputation out of 100. */
  HSCT.endScreen("#hsct-result", {
    earned: S.rep, possible: 100, tier: tier[0],
    sections: Object.keys(SECTIONS).map(n => ({ id: "sec" + n, title: n + ". " + SECTIONS[n], status: { best: "Solid", ok: "Close", bad: "Reread" }[S.secs[n] || "best"] })),
    extra: { grade: S.grade, flags: [...S.flags], teacherMode: teacher },
  });
}

function choose(k){
  const sc = resolve(SCENES[S.i]);
  const c = sc.choices[k];
  if (!c || S.picked != null) return;
  S.picked = k; S.extra = ""; S.stampNew = null;
  S.rep = clamp(S.rep + (c.rep || 0));
  S.grade = clamp(S.grade + (c.grade || 0));
  (c.flags || []).forEach(f => {
    if (f === "disq" && S.flags.has("disq")) {
      S.flags.add("referral"); S.stampNew = "referral";
      S.extra = "Second integrity violation. That's a referral to administration under the Discipline Code, and it can affect CTE certification eligibility and recommendation letters.";
    }
    if (!S.flags.has(f)) { S.flags.add(f); if (FLAGS[f] && !S.stampNew) S.stampNew = f; }
  });
  const rank = { best:0, ok:1, bad:2 }, sec = sc.rule.n;
  if (!(sec in S.secs) || rank[c.v] > rank[S.secs[sec]]) S.secs[sec] = c.v;
  HSCT.log("choice", { scene: S.i, day: DAYS[sc.day], section: sec, picked: k, verdict: c.v, rep: S.rep, grade: S.grade, flags: [...S.flags] });
  renderScene();
}

function next(){
  S.i++; S.picked = null; S.stampNew = null; S.extra = "";
  window.scrollTo({ top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  S.i >= SCENES.length ? renderEnd() : renderScene();
}

app.addEventListener("click", e => {
  const ch = e.target.closest(".choice");
  if (ch && !ch.disabled) return choose(+ch.dataset.k);
  if (e.target.id === "next") return next();
  if (e.target.id === "start") {
    const name = document.getElementById("name").value.trim();
    if (name.length < 2) { document.getElementById("name-err").style.display = "inline"; document.getElementById("name").focus(); return; }
    lastName = name; teacher = document.getElementById("tm").checked; reset(); HSCT.start(name); renderScene();
  }
  if (e.target.id === "again") { reset(); renderStart(); }
});
document.addEventListener("keydown", e => {
  if (!S || S.i >= SCENES.length) return;
  if (/^[1-4]$/.test(e.key) && S.picked == null) choose(+e.key - 1);
  else if (e.key === "Enter" && S.picked != null && e.target.id !== "next") next();
});

renderStart();
</script>
</body>
</html>
